<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Access | Karlvest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8fafc;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #8b026f 0%, #005bb5 100%);
    }

    .form-container {
      perspective: 1000px;
      position: relative;
      width: 100%;
      height: 650px; /* Fix: prevent empty space */
    }

    .front, .form-back {
      backface-visibility: hidden;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .front {
      z-index: 2;
      transform: rotateY(0deg);
    }

    .form-back {
      z-index: 1;
      transform: rotateY(180deg);
    }

    .form-container.flipped .front {
      transform: rotateY(180deg);
    }

    .form-container.flipped .form-back {
      transform: rotateY(0deg);
    }

    .input-group {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #9ca3af;
    }

    .social-btn {
      transition: all 0.3s ease;
    }

    .social-btn:hover {
      transform: translateY(-2px);
    }

    .modal {
      display: none;
    }

    .modal.active {
      display: flex;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Form Container -->
    <div class="form-container">
      <!-- Login Form (Front) -->
      <div class="front bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="gradient-bg p-6 text-white text-center">
          <h1 class="text-3xl font-bold">Welcome Back</h1>
          <p class="opacity-90 mt-2">Sign in to access your account</p>
        </div>
        <div class="p-6">
          <form id="login-form" class="space-y-4">
            <div class="input-group">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="login-email" name="email" placeholder="Email address"
                     class="w-full pl-12 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" required />
            </div>
            <div class="input-group">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="login-password" name="password" placeholder="Password"
                     class="w-full pl-12 pr-10 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" required />
              <i class="fas fa-eye password-toggle" id="toggle-login-password"></i>
            </div>
            <div class="flex items-center justify-between">
              <label class="flex items-center text-sm text-gray-600">
                <input type="checkbox" class="mr-2 rounded text-purple-600" />
                Remember me
              </label>
              <a href="#" id="forgot-password" class="text-purple-600 hover:text-purple-800 text-sm">Forgot password?</a>
            </div>
            <button type="submit"
                    class="gradient-bg text-white w-full py-3 rounded-lg font-bold hover:opacity-90 transition duration-300">
              Sign In <i class="fas fa-sign-in-alt ml-2"></i>
            </button>
            <div class="text-center text-sm text-gray-600 mt-4">
              Don't have an account?
              <button type="button" id="show-register" class="text-purple-600 hover:text-purple-800 font-medium">Create one</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Register Form (Back) -->
      <div class="form-back bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="gradient-bg p-6 text-white text-center">
          <h1 class="text-3xl font-bold">Create Account</h1>
          <p class="opacity-90 mt-2">Join our community today</p>
        </div>
        <div class="p-6">
          <form id="register-form" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="first-name" placeholder="First name"
                       class="w-full pl-12 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" required />
              </div>
              <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="last-name" placeholder="Last name"
                       class="w-full pl-12 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" required />
              </div>
            </div>
            <div class="input-group">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="register-email" placeholder="Email address"
                     class="w-full pl-12 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" required />
            </div>
            <div class="input-group">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="register-password" placeholder="Password"
                     class="w-full pl-12 pr-10 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" required />
              <i class="fas fa-eye password-toggle" id="toggle-register-password"></i>
            </div>
            <div class="input-group">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="confirm-password" placeholder="Confirm password"
                     class="w-full pl-12 pr-10 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" required />
              <i class="fas fa-eye password-toggle" id="toggle-confirm-password"></i>
            </div>
            <label class="flex items-center text-sm text-gray-600">
              <input type="checkbox" required class="mr-2 rounded text-purple-600" />
              I agree to the <a href="#" class="text-purple-600 hover:text-purple-800 ml-1">Terms & Conditions</a>
            </label>
            <button type="submit"
                    class="gradient-bg text-white w-full py-3 rounded-lg font-bold hover:opacity-90 transition duration-300">
              Sign Up <i class="fas fa-user-plus ml-2"></i>
            </button>
            <div class="text-center text-sm text-gray-600 mt-4">
              Already have an account?
              <button type="button" id="show-login" class="text-purple-600 hover:text-purple-800 font-medium">Sign in</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-password-modal"
         class="modal fixed inset-0 bg-gray-600 bg-opacity-50 items-center justify-center z-50">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-semibold text-gray-800">Reset Password</h3>
          <button id="close-forgot-modal" class="text-gray-500 hover:text-gray-700">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form id="forgot-password-form" class="space-y-4">
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="reset-email" placeholder="Email address"
                   class="w-full pl-12 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" required />
          </div>
          <p class="text-sm text-gray-600">We'll send you a link to reset your password.</p>
          <div class="flex justify-end space-x-3 pt-4">
            <button type="button" id="cancel-forgot" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Cancel</button>
            <button type="submit" class="gradient-bg text-white px-4 py-2 rounded-lg hover:opacity-90">Send Reset Link</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const formContainer = document.querySelector('.form-container');
      const showRegisterBtn = document.getElementById('show-register');
      const showLoginBtn = document.getElementById('show-login');
      const forgotPasswordBtn = document.getElementById('forgot-password');
      const forgotPasswordModal = document.getElementById('forgot-password-modal');
      const closeForgotModalBtn = document.getElementById('close-forgot-modal');
      const cancelForgotBtn = document.getElementById('cancel-forgot');

      function setupPasswordToggle(toggleId, fieldId) {
        const toggle = document.getElementById(toggleId);
        const field = document.getElementById(fieldId);
        if (!toggle || !field) return;
        toggle.addEventListener('click', () => {
          const visible = field.type === 'text';
          field.type = visible ? 'password' : 'text';
          toggle.classList.toggle('fa-eye');
          toggle.classList.toggle('fa-eye-slash');
        });
      }

      setupPasswordToggle('toggle-login-password', 'login-password');
      setupPasswordToggle('toggle-register-password', 'register-password');
      setupPasswordToggle('toggle-confirm-password', 'confirm-password');

      showRegisterBtn.addEventListener('click', () => formContainer.classList.add('flipped'));
      showLoginBtn.addEventListener('click', () => formContainer.classList.remove('flipped'));

      forgotPasswordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        forgotPasswordModal.classList.add('active');
      });

      [closeForgotModalBtn, cancelForgotBtn].forEach(btn => {
        btn.addEventListener('click', () => {
          forgotPasswordModal.classList.remove('active');
        });
      });

      window.addEventListener('click', (e) => {
        if (e.target === forgotPasswordModal) {
          forgotPasswordModal.classList.remove('active');
        }
      });

      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Login functionality would be implemented here.');
      });

      document.getElementById('register-form').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Registration functionality would be implemented here.');
      });

      document.getElementById('forgot-password-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('reset-email').value;
        alert(`Password reset link would be sent to: ${email}`);
        forgotPasswordModal.classList.remove('active');
      });
    });
  </script>
</body>
</html>
